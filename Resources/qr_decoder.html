    function decodeQR(base64Image) {
    const image = new Image();
    // On s'assure que le préfixe est là
    image.src = base64Image.startsWith('data:') ? base64Image : "data:image/png;base64," + base64Image;

    
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const resultBox = document.getElementById('result-box');

        image.onload = () => {
        canvas.width = image.width;
        canvas.height = image.height;
        context.drawImage(image, 0, 0);

        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);

        let finalResult = "";
        if (code) {
            finalResult = code.data;
        } else {
            finalResult = "ERREUR : Aucun QR Code détecté";
        }

        resultBox.innerText = finalResult;
        
        document.title = "DECODAGE_TERMINE"; 
        
        console.log("Terminé : " + finalResult);
        };

    image.onerror = () => {
        document.getElementById('result-box').innerText = "ERREUR : Image invalide";
        document.title = "DECODAGE_TERMINE";
    };
}

       
        window.onload = function() {
          
            const urlParams = new URLSearchParams(window.location.search);
            const defaultBase64 = urlParams.get('image') || "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="; 
          
            // console.log(defaultBase64)
