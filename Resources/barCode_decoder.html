<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    
    <script src="zxing.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; text-align: center; }
        #result-box { padding: 15px; border: 2px solid #28a745; background: white; font-weight: bold; margin-top: 10px; min-height: 30px; }
        #preview-img { max-width: 100%; border: 1px solid #ccc; margin-top: 10px; display: none; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <div id="status">Statut : Prêt pour analyse</div>
    <div id="result-box">En attente de l'image...</div>
    <img id="preview-img" src=""/>

    <script>
        async function decodeBarcode(base64Image) {
            const resultBox = document.getElementById('result-box');
            const status = document.getElementById('status');
            const preview = document.getElementById('preview-img');

            status.innerText = "Analyse en cours (ZXing)...";
            preview.src = base64Image;
            preview.style.display = "block";

            // On attend que l'image soit bien chargée dans le DOM
            preview.onload = async () => {
                try {
                    // On vérifie si la bibliothèque est bien chargée
                    if (typeof ZXing === 'undefined') {
                        throw new Error("La bibliothèque ZXing n'est pas chargée. Vérifiez le fichier .js");
                    }

                    const codeReader = new ZXing.BrowserMultiFormatReader();
                    
                    // Décodage de l'image
                    const result = await codeReader.decodeFromImageElement(preview);
                    
                    // Affichage du résultat
                    resultBox.innerText = result.text;
                    status.innerText = "✅ SUCCÈS (" + result.format + ")";
                    document.title = "DECODAGE_TERMINE";

                } catch (err) {
                    // console.error(err);
                    resultBox.innerText = "❌ ÉCHEC : " + (err.name === 'NotFoundException' ? "Aucun code détecté" : err.message);
                    status.innerText = "Statut : Échec";
                    document.title = "DECODAGE_TERMINE";
                }
            };
        }
